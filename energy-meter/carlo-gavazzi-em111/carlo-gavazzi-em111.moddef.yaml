            access: READ_ONLY
            storage_type: S32
            value_type: { primitive: DECIMAL }
            mapping: { space: INPUT_REGISTER, offset: 1032, length_words: 2, byte_order: BIG_ENDIAN, word_order: WORD_LITTLE_ENDIAN } # 0x0408
            transform: { scale: { numerator: 1, denominator: 1 } }
            unit: kWh
            measurand: { base_quantity: energy_active, direction: EXPORT, accumulation: LIFETIME, aggregation: TOTAL }

          - point_id: energy_active_export_total_dec
            name: "Exported Active Energy Total, Decimal Part"
