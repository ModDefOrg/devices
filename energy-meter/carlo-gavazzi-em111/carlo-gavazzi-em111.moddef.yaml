      - block_id: totalizers_split
        name: "Integer/Decimal Totalizers (Table 2.4-3)"
        space: INPUT_REGISTER
        start_offset: 1024 # 0x0400
        length_words: 16
        points:
          - point_id: energy_active_import_total_int
            name: "Imported Active Energy Total, Integer Part"
            description: "Whole kWh of the imported active total. For 1234.567 kWh this reads 1234."
            access: READ_ONLY
            storage_type: S32
            value_type: { primitive: DECIMAL }
            mapping: { space: INPUT_REGISTER, offset: 1024, length_words: 2, byte_order: BIG_ENDIAN, word_order: WORD_LITTLE_ENDIAN } # 0x0400
            transform: { scale: { numerator: 1, denominator: 1 } }
            unit: kWh
            measurand: { base_quantity: energy_active, direction: IMPORT, accumulation: LIFETIME, aggregation: TOTAL }

          - point_id: energy_active_import_total_dec
            name: "Imported Active Energy Total, Decimal Part"
            description: "Thousandths of a kWh of the imported active total. For 1234.567 kWh this reads 567. The most significant word is always 0."
            access: READ_ONLY
            storage_type: S32
            value_type: { primitive: DECIMAL }
            mapping: { space: INPUT_REGISTER, offset: 1026, length_words: 2, byte_order: BIG_ENDIAN, word_order: WORD_LITTLE_ENDIAN } # 0x0402
            transform: { scale: { numerator: 1, denominator: 1000 } }
            unit: kWh
            measurand: { base_quantity: energy_active, direction: IMPORT, accumulation: LIFETIME, aggregation: TOTAL }

          - point_id: energy_reactive_import_total_int
            name: "Imported Reactive Energy Total, Integer Part"
