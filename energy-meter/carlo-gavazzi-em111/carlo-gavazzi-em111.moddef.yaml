            access: READ_ONLY
            storage_type: S32
            value_type: { primitive: DECIMAL }
            mapping: { space: INPUT_REGISTER, offset: 1034, length_words: 2, byte_order: BIG_ENDIAN, word_order: WORD_LITTLE_ENDIAN } # 0x040A
            transform: { scale: { numerator: 1, denominator: 1000 } }
            unit: kWh
            measurand: { base_quantity: energy_active, direction: EXPORT, accumulation: LIFETIME, aggregation: TOTAL }

          - point_id: energy_reactive_export_total_int
            name: "Exported Reactive Energy Total, Integer Part"
            description: "Whole kvarh of the exported reactive total. Reads 0 on PFA versions and on X versions set to measurement mode A."
            access: READ_ONLY
            storage_type: S32
            value_type: { primitive: DECIMAL }
            mapping: { space: INPUT_REGISTER, offset: 1036, length_words: 2, byte_order: BIG_ENDIAN, word_order: WORD_LITTLE_ENDIAN } # 0x040C
            transform: { scale: { numerator: 1, denominator: 1 } }
            unit: kvarh
            measurand: { base_quantity: energy_reactive, direction: EXPORT, accumulation: LIFETIME, aggregation: TOTAL }

          - point_id: energy_reactive_export_total_dec
            name: "Exported Reactive Energy Total, Decimal Part"
            description: "Thousandths of a kvarh of the exported reactive total. Reads 0 on PFA versions and on X versions set to measurement mode A."
            access: READ_ONLY
            storage_type: S32
            value_type: { primitive: DECIMAL }
            mapping: { space: INPUT_REGISTER, offset: 1038, length_words: 2, byte_order: BIG_ENDIAN, word_order: WORD_LITTLE_ENDIAN } # 0x040E
            transform: { scale: { numerator: 1, denominator: 1000 } }
            unit: kvarh
            measurand: { base_quantity: energy_reactive, direction: EXPORT, accumulation: LIFETIME, aggregation: TOTAL }


      # Document table 2.4-4. Same availability as table 2.4-3: EM111 and EM112 from
      # firmware b.10, instruments built from 2020-01-01. 0510h-051Bh and the kVAh
      # pair at 052Ch-0533h read 0 and are left out. The table gives no value
      # weight; 1/10 is taken from the 32-bit counters of the same quantities.
      - block_id: totalizers_64
        name: "64-bit Totalizers (Table 2.4-4)"
        space: INPUT_REGISTER
        start_offset: 1280 # 0x0500
        length_words: 52
        points:
          - point_id: energy_active_import_total_64
            name: "Imported Active Energy Total (64-bit)"
            description: "64-bit copy of the counter of the same name, for masters that want headroom past the 32-bit rollover."
            access: READ_ONLY
            storage_type: S64
            value_type: { primitive: DECIMAL }
            mapping: { space: INPUT_REGISTER, offset: 1280, length_words: 4, byte_order: BIG_ENDIAN, word_order: WORD_LITTLE_ENDIAN } # 0x0500
            transform: { scale: { numerator: 1, denominator: 10 } }
            unit: kWh
            measurand: { base_quantity: energy_active, direction: IMPORT, accumulation: LIFETIME, aggregation: TOTAL }

          - point_id: energy_reactive_import_total_64
            name: "Imported Reactive Energy Total (64-bit)"
            description: "64-bit copy of the counter of the same name, for masters that want headroom past the 32-bit rollover."
            access: READ_ONLY
            storage_type: S64
            value_type: { primitive: DECIMAL }
            mapping: { space: INPUT_REGISTER, offset: 1284, length_words: 4, byte_order: BIG_ENDIAN, word_order: WORD_LITTLE_ENDIAN } # 0x0504
            transform: { scale: { numerator: 1, denominator: 10 } }
            unit: kvarh
            measurand: { base_quantity: energy_reactive, direction: IMPORT, accumulation: LIFETIME, aggregation: TOTAL }

          - point_id: energy_active_import_partial_64
            name: "Imported Active Energy Partial (64-bit)"
            description: "64-bit copy of the counter of the same name, for masters that want headroom past the 32-bit rollover."
            access: READ_ONLY
            storage_type: S64
            value_type: { primitive: DECIMAL }
            mapping: { space: INPUT_REGISTER, offset: 1288, length_words: 4, byte_order: BIG_ENDIAN, word_order: WORD_LITTLE_ENDIAN } # 0x0508
            transform: { scale: { numerator: 1, denominator: 10 } }
            unit: kWh
            measurand: { base_quantity: energy_active, direction: IMPORT, accumulation: SESSION, aggregation: TOTAL }

          - point_id: energy_reactive_import_partial_64
            name: "Imported Reactive Energy Partial (64-bit)"
            description: "64-bit copy of the counter of the same name, for masters that want headroom past the 32-bit rollover."
            access: READ_ONLY
            storage_type: S64
            value_type: { primitive: DECIMAL }
            mapping: { space: INPUT_REGISTER, offset: 1292, length_words: 4, byte_order: BIG_ENDIAN, word_order: WORD_LITTLE_ENDIAN } # 0x050C
            transform: { scale: { numerator: 1, denominator: 10 } }
            unit: kvarh
            measurand: { base_quantity: energy_reactive, direction: IMPORT, accumulation: SESSION, aggregation: TOTAL }

          - point_id: energy_active_export_total_64
            name: "Exported Active Energy Total (64-bit)"
            description: "64-bit copy of the counter of the same name, for masters that want headroom past the 32-bit rollover."
            access: READ_ONLY
            storage_type: S64
            value_type: { primitive: DECIMAL }
            mapping: { space: INPUT_REGISTER, offset: 1308, length_words: 4, byte_order: BIG_ENDIAN, word_order: WORD_LITTLE_ENDIAN } # 0x051C
            transform: { scale: { numerator: 1, denominator: 10 } }
            unit: kWh
            measurand: { base_quantity: energy_active, direction: EXPORT, accumulation: LIFETIME, aggregation: TOTAL }

          - point_id: energy_active_export_partial_64
            name: "Exported Active Energy Partial (64-bit)"
            description: "64-bit copy of the counter of the same name, for masters that want headroom past the 32-bit rollover."
            access: READ_ONLY
            storage_type: S64
            value_type: { primitive: DECIMAL }
            mapping: { space: INPUT_REGISTER, offset: 1312, length_words: 4, byte_order: BIG_ENDIAN, word_order: WORD_LITTLE_ENDIAN } # 0x0520
            transform: { scale: { numerator: 1, denominator: 10 } }
            unit: kWh
            measurand: { base_quantity: energy_active, direction: EXPORT, accumulation: SESSION, aggregation: TOTAL }

          - point_id: energy_reactive_export_total_64
            name: "Exported Reactive Energy Total (64-bit)"
            description: "64-bit copy of the counter of the same name, for masters that want headroom past the 32-bit rollover."
            access: READ_ONLY
            storage_type: S64
            value_type: { primitive: DECIMAL }
            mapping: { space: INPUT_REGISTER, offset: 1316, length_words: 4, byte_order: BIG_ENDIAN, word_order: WORD_LITTLE_ENDIAN } # 0x0524
            transform: { scale: { numerator: 1, denominator: 10 } }
            unit: kvarh
            measurand: { base_quantity: energy_reactive, direction: EXPORT, accumulation: LIFETIME, aggregation: TOTAL }

          - point_id: energy_reactive_export_partial_64
            name: "Exported Reactive Energy Partial (64-bit)"
            description: "64-bit copy of the counter of the same name, for masters that want headroom past the 32-bit rollover."
            access: READ_ONLY
            storage_type: S64
            value_type: { primitive: DECIMAL }
            mapping: { space: INPUT_REGISTER, offset: 1320, length_words: 4, byte_order: BIG_ENDIAN, word_order: WORD_LITTLE_ENDIAN } # 0x0528
            transform: { scale: { numerator: 1, denominator: 10 } }
            unit: kvarh
            measurand: { base_quantity: energy_reactive, direction: EXPORT, accumulation: SESSION, aggregation: TOTAL }


      # Document table 2.5-1. Both registers are read one word at a time.
      - block_id: version
        name: "Firmware Version (Table 2.5-1)"
        space: INPUT_REGISTER
        start_offset: 770 # 0x0302
        length_words: 2
        points:
          - point_id: version_code
            name: "Version Code"
            description: "Firmware version as a number: 3 means version \"d\"."
            access: READ_ONLY
            storage_type: U16
            value_type: { primitive: UINT32 }
            mapping: { space: INPUT_REGISTER, offset: 770 } # 0x0302

          - point_id: revision_code
            name: "Revision Code"
            description: "Firmware revision as a number: 0 means revision \"0\"."
            access: READ_ONLY
            storage_type: U16
            value_type: { primitive: UINT32 }
            mapping: { space: INPUT_REGISTER, offset: 771 } # 0x0303


      # Document table 2.7-1. Guards front-panel programming; the document does not
      # make it a gate on Modbus writes.
      - block_id: settings_password
        name: "Password Menu (Table 2.7-1)"
        space: HOLDING_REGISTER
        start_offset: 4096 # 0x1000
        length_words: 1
        points:
          - point_id: password
            name: "Password"
            description: "Front-panel password, 0 to 9999. EM models only; always 0 on ET models."
            access: READ_WRITE
            storage_type: U16
            value_type: { primitive: UINT32 }
            mapping: { space: HOLDING_REGISTER, offset: 4096 } # 0x1000
            write: { behavior: DIRECT, constraints: { min_value: { numerator: 0, denominator: 1 }, max_value: { numerator: 9999, denominator: 1 } } }


      # Document table 2.7-2.
      - block_id: settings_system
        name: "System and Primary Current Menu (Table 2.7-2)"
        space: HOLDING_REGISTER
        start_offset: 4098 # 0x1002
        length_words: 3
        points:
          - point_id: measuring_system
            name: "Measuring System"
            description: "Wiring system. The EM111 documents only value 0, single phase."
            access: READ_WRITE
            storage_type: U16
            value_type: { enum_ref: { type_id: measuring_system } }
            mapping: { space: HOLDING_REGISTER, offset: 4098 } # 0x1002
            write: { behavior: DIRECT, constraints: { allowed_values: [0] } }

          - point_id: primary_current
            name: "Primary Current"
            description: "CT primary current in tenths of an amp: 10 is 1 A and 6000 is 600 A. 600 A is the documented maximum for the MV5 model."
            access: READ_WRITE
            storage_type: U32
            value_type: { primitive: DECIMAL }
            mapping: { space: HOLDING_REGISTER, offset: 4099, length_words: 2, byte_order: BIG_ENDIAN, word_order: WORD_LITTLE_ENDIAN } # 0x1003
            transform: { scale: { numerator: 1, denominator: 10 } }
            unit: A
            write: { behavior: DIRECT, constraints: { min_value: { numerator: 1, denominator: 1 }, max_value: { numerator: 600, denominator: 1 }, safety_note: "Changing the CT ratio rescales every current, power and energy reading" } }


      # Document table 2.7-3. 1014h-101Fh is not part of the menu. The document gives
      # no Modicom addresses for these four registers, only physical ones.
      - block_id: settings_dmd_pulse
        name: "Demand and Pulse Output Menu (Table 2.7-3)"
        space: HOLDING_REGISTER
        start_offset: 4112 # 0x1010
        length_words: 20
        points:
          - point_id: demand_integration_time
            name: "Demand Integration Time"
            description: "Integration window for the demand calculation, 1 to 30 minutes."
            access: READ_WRITE
            storage_type: U32
            value_type: { primitive: UINT32 }
            mapping: { space: HOLDING_REGISTER, offset: 4112, length_words: 2, byte_order: BIG_ENDIAN, word_order: WORD_LITTLE_ENDIAN } # 0x1010
            unit: min
            write: { behavior: DIRECT, constraints: { min_value: { numerator: 1, denominator: 1 }, max_value: { numerator: 30, denominator: 1 } } }

          - point_id: pulse_ton
            name: "Pulse Output On-Time"
            description: "Width of the pulse output square wave: 0 is 30 ms, 1 is 100 ms."
            access: READ_WRITE
            storage_type: U32
            value_type: { enum_ref: { type_id: pulse_ton } }
            mapping: { space: HOLDING_REGISTER, offset: 4114, length_words: 2, byte_order: BIG_ENDIAN, word_order: WORD_LITTLE_ENDIAN } # 0x1012
            write: { behavior: DIRECT, constraints: { allowed_values: [0, 1] } }

          - point_id: pulse1_kwh_per_pulse
            name: "kWh per Pulse, Output 1"
            description: "Energy per pulse on digital output 1, if that output exists on this model. The document gives no unit weight for this register."
            access: READ_WRITE
            storage_type: U32
            value_type: { primitive: UINT32 }
            mapping: { space: HOLDING_REGISTER, offset: 4128, length_words: 2, byte_order: BIG_ENDIAN, word_order: WORD_LITTLE_ENDIAN } # 0x1020
            write: { behavior: DIRECT }

          - point_id: pulse2_kwh_per_pulse
            name: "kWh per Pulse, Output 2"
            description: "Energy per pulse on digital output 2, if that output exists on this model. The document gives no unit weight for this register."
            access: READ_WRITE
            storage_type: U32
            value_type: { primitive: UINT32 }
            mapping: { space: HOLDING_REGISTER, offset: 4130, length_words: 2, byte_order: BIG_ENDIAN, word_order: WORD_LITTLE_ENDIAN } # 0x1022
            write: { behavior: DIRECT }


      # Document table 2.7-4.
      - block_id: settings_other
        name: "Other Functions Menu (Table 2.7-4)"
        space: HOLDING_REGISTER
        start_offset: 4352 # 0x1100
        length_words: 4
        points:
          - point_id: display_mode
            name: "Display Mode"
            description: "Display layout, EM112 only. Any value other than 0 or 1 is treated as Full."
            access: READ_WRITE
            storage_type: U16
            value_type: { enum_ref: { type_id: display_mode } }
            mapping: { space: HOLDING_REGISTER, offset: 4352 } # 0x1100
            write: { behavior: DIRECT, constraints: { allowed_values: [0, 1] } }

          - point_id: tariff_management_enable
            name: "Tariff Management Enable"
            description: "Whether tariff metering is active. Any value other than 0 or 1 is treated as OFF."
            access: READ_WRITE
            storage_type: U16
            value_type: { primitive: BOOL }
            mapping: { space: HOLDING_REGISTER, offset: 4353 } # 0x1101
            write: { behavior: DIRECT }

          - point_id: home_page
            name: "Home Page"
            description: "Which display page the meter returns to, 0 to 17. EM112 only; the document says it is always 0 on other models, and Easy display mode restricts the choice."
            access: READ_WRITE
            storage_type: U16
            value_type: { primitive: UINT32 }
            mapping: { space: HOLDING_REGISTER, offset: 4354 } # 0x1102
            write: { behavior: DIRECT, constraints: { min_value: { numerator: 0, denominator: 1 }, max_value: { numerator: 17, denominator: 1 } } }

          - point_id: measurement_mode
            name: "Measurement Mode"
            description: "Sign convention: 0 is easy connection, 1 is bidirectional. Any other value is treated as A. Documented quirk (revision 2.12): writing the same value twice or more toggles the mode instead of setting it, so this behaves as a toggle rather than a setpoint."
            access: READ_WRITE
            storage_type: U16
            value_type: { enum_ref: { type_id: measurement_mode } }
            mapping: { space: HOLDING_REGISTER, offset: 4355 } # 0x1103
            write: { behavior: DIRECT, constraints: { allowed_values: [0, 1], safety_note: "Writing the same value more than once toggles the measurement mode; read it back rather than writing blind" } }


      # Document table 2.7-6.
      - block_id: settings_serial
        name: "Serial Port Menu (Table 2.7-6)"
        space: HOLDING_REGISTER
        start_offset: 8192 # 0x2000
        length_words: 5
        points:
          - point_id: modbus_address
            name: "Modbus Address"
            description: "RS485 instrument address, 1 to 247, default 1. Address 0 is the broadcast address."
            access: READ_WRITE
            storage_type: U16
            value_type: { primitive: UINT32 }
            mapping: { space: HOLDING_REGISTER, offset: 8192 } # 0x2000
            write: { behavior: DIRECT, constraints: { min_value: { numerator: 1, denominator: 1 }, max_value: { numerator: 247, denominator: 1 }, safety_note: "Changing the address drops the current connection; the meter answers on the new address immediately" } }

          - point_id: baud_rate
            name: "Baud Rate"
            description: "RS485 line speed. Any value outside 1 to 5 is treated as 9.6 kbps."
            access: READ_WRITE
            storage_type: U16
            value_type: { enum_ref: { type_id: baud_rate } }
            mapping: { space: HOLDING_REGISTER, offset: 8193 } # 0x2001
            write: { behavior: DIRECT, constraints: { allowed_values: [1, 2, 3, 4, 5], safety_note: "Changing the baud rate drops the current connection" } }

          - point_id: parity
            name: "Parity"
            description: "RS485 parity. Any value other than 1 or 2 is treated as no parity."
            access: READ_WRITE
            storage_type: U16
            value_type: { enum_ref: { type_id: parity } }
            mapping: { space: HOLDING_REGISTER, offset: 8194 } # 0x2002
            write: { behavior: DIRECT, constraints: { allowed_values: [1, 2], safety_note: "Changing the parity drops the current connection" } }

          - point_id: stop_bits
            name: "Stop Bits"
            description: "RS485 stop bits. Two stop bits are only accepted when parity is even; otherwise the meter forces 1."
            access: READ_WRITE
            storage_type: U16
            value_type: { enum_ref: { type_id: stop_bits } }
            mapping: { space: HOLDING_REGISTER, offset: 8195 } # 0x2003
            write: { behavior: DIRECT, constraints: { allowed_values: [1, 2], safety_note: "Changing the stop bits drops the current connection" } }

          - point_id: max_words_per_request
            name: "Maximum Words per Request"
            description: "How many words the meter allows in one Modbus request. Reads 50 and is read-only despite sitting in a read/write menu."
            access: READ_ONLY
            storage_type: U16
            value_type: { primitive: UINT32 }
            mapping: { space: HOLDING_REGISTER, offset: 8196 } # 0x2004


      # Document table 2.7-7. Write 1 to run; the register reads 0 once the reset is
      # done, and any other value does nothing. 4002h (hour counter reset) is ET112
      # only and is left out, as is the hour counter itself.
      - block_id: commands
        name: "Reset Commands (Table 2.7-7)"
        space: HOLDING_REGISTER
        start_offset: 16384 # 0x4000
        length_words: 2
        points:
          - point_id: reset_partial_meters
            name: "Reset Partial and Tariff Meters"
            description: "Clears the partial meters, the tariff meters, the demand and the demand peak. Write 1 to run."
            access: COMMAND
            storage_type: U16
            value_type: { primitive: UINT32 }
            mapping: { space: HOLDING_REGISTER, offset: 16384 } # 0x4000
            write: { behavior: COMMAND_TRIGGER, constraints: { allowed_values: [1], safety_note: "Irreversible; the total energy meters are unaffected" } }

          - point_id: reset_total_meters
            name: "Reset Total Energy Meters"
            description: "Clears the total energy meters. Only available on non-MID versions, the X option. Write 1 to run."
            access: COMMAND
            storage_type: U16
            value_type: { primitive: UINT32 }
            mapping: { space: HOLDING_REGISTER, offset: 16385 } # 0x4001
            write: { behavior: COMMAND_TRIGGER, constraints: { allowed_values: [1], safety_note: "Irreversible and unavailable on MID-sealed versions; this clears the billing totals" } }


      # Document tables 2.7-8 and 2.7-9. 5007h-500Fh is not part of either table.
      - block_id: identity
        name: "Serial Number and Production Year (Tables 2.7-8, 2.7-9)"
        space: INPUT_REGISTER
        start_offset: 20480 # 0x5000
        length_words: 17
        points:
          - point_id: serial_number
            name: "Serial Number"
            description: "Seven-character serial number, one character per register from 5000h to 5006h. Each register holds the ASCII code in its low byte and the document says the high byte is \"not to be used\", so the characters are bytes 1, 3, 5, 7, 9, 11 and 13 of the 14-byte read. That is not the two-per-word packing STRING_ASCII assumes, hence the raw byte range."
            access: READ_ONLY
            storage_type: BYTES_RAW
            value_type: { primitive: BYTES }
            mapping: { space: INPUT_REGISTER, offset: 20480, length_words: 7, byte_order: BIG_ENDIAN, word_order: WORD_LITTLE_ENDIAN } # 0x5000

          - point_id: production_year
            name: "Production Year"
            description: "Year of manufacture. Available only in EM111 units built from 2018-10-01, serial YR2018 274xxxS and up."
            access: READ_ONLY
            storage_type: U16
            value_type: { primitive: UINT32 }
            mapping: { space: INPUT_REGISTER, offset: 20496 } # 0x5010
