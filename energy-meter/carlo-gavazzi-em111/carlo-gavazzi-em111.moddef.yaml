            access: READ_ONLY
            storage_type: S32
            value_type: { primitive: DECIMAL }
            mapping: { space: INPUT_REGISTER, offset: 1028, length_words: 2, byte_order: BIG_ENDIAN, word_order: WORD_LITTLE_ENDIAN } # 0x0404
            transform: { scale: { numerator: 1, denominator: 1 } }
            unit: kvarh
            measurand: { base_quantity: energy_reactive, direction: IMPORT, accumulation: LIFETIME, aggregation: TOTAL }

          - point_id: energy_reactive_import_total_dec
            name: "Imported Reactive Energy Total, Decimal Part"
            description: "Thousandths of a kvarh of the imported reactive total. The most significant word is always 0."
            access: READ_ONLY
            storage_type: S32
            value_type: { primitive: DECIMAL }
            mapping: { space: INPUT_REGISTER, offset: 1030, length_words: 2, byte_order: BIG_ENDIAN, word_order: WORD_LITTLE_ENDIAN } # 0x0406
            transform: { scale: { numerator: 1, denominator: 1000 } }
            unit: kvarh
            measurand: { base_quantity: energy_reactive, direction: IMPORT, accumulation: LIFETIME, aggregation: TOTAL }

