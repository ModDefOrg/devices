    commands:
      - command_id: start_all_partial_meters
        name: Start All Partial Energy Meters
        description: Write 0x0D01 to register 0x0526 to start every partial energy meter, then read back the status bitmap (manual table A-22)
        steps:
          - name: start
            write: { trigger: { point_id: partial_meter_control, value: 0x0D01 } }
          - name: read_status
            read: { point_id: partial_meter_status, into: status }
        results:
          - field: status
            from: status
            value_type: { primitive: UINT32 }

      - command_id: stop_all_partial_meters
        name: Stop All Partial Energy Meters
        description: Write 0x0D02 to register 0x0526 to stop every partial energy meter, then read back the status bitmap (manual table A-22)
        steps:
          - name: stop
            write: { trigger: { point_id: partial_meter_control, value: 0x0D02 } }
          - name: read_status
            read: { point_id: partial_meter_status, into: status }
        results:
          - field: status
            from: status
            value_type: { primitive: UINT32 }

      - command_id: reset_all_partial_meters
        name: Reset All Partial Energy Meters
        description: Write 0x0D03 to register 0x0526 to reset every partial energy meter to zero, then read back the status bitmap. The MID-sealed total energy meters are not affected (manual table 6-1)
        steps:
          - name: reset
            write: { trigger: { point_id: partial_meter_control, value: 0x0D03 } }
          - name: read_status
            read: { point_id: partial_meter_status, into: status }
        results:
          - field: status
            from: status
            value_type: { primitive: UINT32 }

      - command_id: sync_demand_interval
        name: Synchronize Demand Interval
        description: Close the running mean-value interval and start a new one by writing 0x0001 to register 0x053D; only effective when 0x053C selects broadcast synchronization (manual table A-18)
        steps:
          - name: sync
            write: { trigger: { point_id: demand_interval_sync, value: 1 } }
          - name: read_config
            read: { point_id: demand_interval_config, into: interval_config }
        results:
          - field: interval_config
            from: interval_config
            value_type: { primitive: UINT32 }

      - command_id: save_configuration
        name: Save Configuration And Restart
        description: Buffer the pending configuration in EEPROM and restart the device by writing 0xA1 to register 0xE200 (manual table A-21). Communication drops for the duration of the restart
        steps:
          - name: save
            write: { trigger: { point_id: config_action, value: 0xA1 } }
        results:
          - field: serial_number
            from: serial_number
            value_type: { primitive: STRING }

      - command_id: load_configuration
        name: Load Configuration From EEPROM
        description: Discard the pending configuration and reload the stored one by writing 0xB2 to register 0xE200 (manual table A-21)
        steps:
          - name: load
            write: { trigger: { point_id: config_action, value: 0xB2 } }
          - name: read_address
            read: { point_id: modbus_address, into: modbus_address }
        results:
          - field: modbus_address
            from: modbus_address
            value_type: { primitive: UINT32 }

