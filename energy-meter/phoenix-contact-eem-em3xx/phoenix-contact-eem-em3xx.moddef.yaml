      # The manual's ordering is unusual and is transcribed as printed: the
      # undercurrent alarms for I3/IN sit at coils 16/17 and are evaluated
      # against the secondary current, while those for Isys/I1/I2 sit at
      # coils 29 ... 31 and are evaluated against the starting current.
