      # --- A 16: device information and configuration (0x0500) --------------
      # Read-only mirrors: the Modbus address at 0x051E and the baud rate at
      # 0x0522 are written through 0xE124 / 0xE11F (tables A-19 and A-20).
      - block_id: device_info
        name: "Device Information and Configuration (0x0500)"
        space: HOLDING_REGISTER
        start_offset: 1280
        length_words: 52
        points:
          - point_id: serial_number
            name: "Serial Number"
            description: "Serial number, 10 ASCII digits right-aligned in 12 bytes (example: ARTV100002)"
            access: READ_ONLY
            storage_type: STRING_ASCII
            value_type: { primitive: STRING }
            mapping: { space: HOLDING_REGISTER, offset: 1280, length_words: 6, byte_order: BIG_ENDIAN, word_order: WORD_BIG_ENDIAN, string_encoding: { charset: ASCII, padding: PADDING_NULL, termination: FIXED_LENGTH } }  # 0x0500

          - point_id: reserved_0x0506
            name: "Reserved 0x0506"
            description: "Reserved by the vendor, no function assigned"
            access: READ_ONLY
            storage_type: U32
            value_type: { primitive: UINT32 }
            mapping: { space: HOLDING_REGISTER, offset: 1286, length_words: 2, byte_order: BIG_ENDIAN, word_order: WORD_BIG_ENDIAN }  # 0x0506

          - point_id: reserved_0x0508
            name: "Reserved 0x0508"
            description: "Reserved by the vendor, no function assigned"
            access: READ_ONLY
            storage_type: U32
            value_type: { primitive: UINT32 }
            mapping: { space: HOLDING_REGISTER, offset: 1288, length_words: 2, byte_order: BIG_ENDIAN, word_order: WORD_BIG_ENDIAN }  # 0x0508

          - point_id: firmware_release_metrology
            name: "Metrological Firmware Release"
            description: "Release number 1 - metrological firmware, encoded as hundredths (102 = 1.02); LCD page rEL1"
            access: READ_ONLY
            storage_type: U32
            value_type: { primitive: DECIMAL }
            mapping: { space: HOLDING_REGISTER, offset: 1290, length_words: 2, byte_order: BIG_ENDIAN, word_order: WORD_BIG_ENDIAN }  # 0x050A
            transform: { scale: { numerator: 1, denominator: 100 } }

          - point_id: firmware_release_ui
            name: "User Interface Firmware Release"
            description: "Release number 2 - user interface firmware, encoded as hundredths (102 = 1.02); LCD page rEL2"
            access: READ_ONLY
            storage_type: U32
            value_type: { primitive: DECIMAL }
            mapping: { space: HOLDING_REGISTER, offset: 1292, length_words: 2, byte_order: BIG_ENDIAN, word_order: WORD_BIG_ENDIAN }  # 0x050C
            transform: { scale: { numerator: 1, denominator: 100 } }

          - point_id: reserved_0x050e
            name: "Reserved 0x050E"
            description: "Reserved by the vendor, no function assigned"
            access: READ_ONLY
            storage_type: U32
            value_type: { primitive: UINT32 }
            mapping: { space: HOLDING_REGISTER, offset: 1294, length_words: 2, byte_order: BIG_ENDIAN, word_order: WORD_BIG_ENDIAN }  # 0x050E

          - point_id: active_tariff
            name: "Active Tariff"
            description: "Tariff meter currently accumulating"
            access: READ_ONLY
            storage_type: U32
            value_type: { enum_ref: { type_id: active_tariff } }
            mapping: { space: HOLDING_REGISTER, offset: 1296, length_words: 2, byte_order: BIG_ENDIAN, word_order: WORD_BIG_ENDIAN }  # 0x0510

          - point_id: reserved_0x0512
            name: "Reserved 0x0512"
            description: "Reserved by the vendor, no function assigned"
            access: READ_ONLY
            storage_type: U32
            value_type: { primitive: UINT32 }
            mapping: { space: HOLDING_REGISTER, offset: 1298, length_words: 2, byte_order: BIG_ENDIAN, word_order: WORD_BIG_ENDIAN }  # 0x0512

          - point_id: error_code
            name: "Error Code"
            description: "Device error bitmap; 0 = no error. Bit 2 (real time clock lost) only occurs on the Ethernet models"
            access: READ_ONLY
            storage_type: U32
            value_type:
              flags:
                bits:
                  "0": phase_sequence_error
                  "1": memory_error
                  "2": real_time_clock_lost
            mapping: { space: HOLDING_REGISTER, offset: 1300, length_words: 2, byte_order: BIG_ENDIAN, word_order: WORD_BIG_ENDIAN }  # 0x0514
            measurand: { base_quantity: fault_code }

          - point_id: ct_primary_current
            name: "Current Transformer Primary Current"
            description: "Configured primary current of the external current transformer, 1 ... 50000 (0x0001 ... 0xC350)"
            access: READ_ONLY
            storage_type: U32
            value_type: { primitive: UINT32 }
            mapping: { space: HOLDING_REGISTER, offset: 1302, length_words: 2, byte_order: BIG_ENDIAN, word_order: WORD_BIG_ENDIAN }  # 0x0516
            unit: A

          - point_id: reserved_0x0518
            name: "Reserved 0x0518"
            description: "Reserved by the vendor, no function assigned"
            access: READ_ONLY
            storage_type: U32
            value_type: { primitive: UINT32 }
            mapping: { space: HOLDING_REGISTER, offset: 1304, length_words: 2, byte_order: BIG_ENDIAN, word_order: WORD_BIG_ENDIAN }  # 0x0518

          - point_id: ct_secondary_current
            name: "Current Transformer Secondary Nominal Current"
            description: "Configured secondary nominal current; LCD page FSA (current transformer models only)"
            access: READ_ONLY
            storage_type: U32
            value_type: { enum_ref: { type_id: secondary_nominal_current } }
            mapping: { space: HOLDING_REGISTER, offset: 1306, length_words: 2, byte_order: BIG_ENDIAN, word_order: WORD_BIG_ENDIAN }  # 0x051A

          - point_id: grid_type
            name: "Grid Type"
            description: "Configured network topology; LCD page Wir"
            access: READ_ONLY
            storage_type: U32
            value_type: { enum_ref: { type_id: grid_type } }
            mapping: { space: HOLDING_REGISTER, offset: 1308, length_words: 2, byte_order: BIG_ENDIAN, word_order: WORD_BIG_ENDIAN }  # 0x051C

          - point_id: modbus_address
            name: "Modbus Address"
            description: "Configured Modbus server address, 1 ... 247 (0x01 ... 0xF7); fixed at 255 on the Modbus/TCP models"
            access: READ_ONLY
            storage_type: U32
            value_type: { primitive: UINT32 }
            mapping: { space: HOLDING_REGISTER, offset: 1310, length_words: 2, byte_order: BIG_ENDIAN, word_order: WORD_BIG_ENDIAN }  # 0x051E

          - point_id: reserved_0x0520
            name: "Reserved 0x0520"
            description: "Reserved by the vendor, no function assigned"
            access: READ_ONLY
            storage_type: U32
            value_type: { primitive: UINT32 }
            mapping: { space: HOLDING_REGISTER, offset: 1312, length_words: 2, byte_order: BIG_ENDIAN, word_order: WORD_BIG_ENDIAN }  # 0x0520

          - point_id: baud_rate_readback
            name: "Modbus/RTU Baud Rate (read-back)"
            description: "Configured serial line speed; reads 0xFFFFFFFF on the Modbus/TCP models"
            access: READ_ONLY
            storage_type: U32
            value_type: { enum_ref: { type_id: baud_rate } }
            mapping: { space: HOLDING_REGISTER, offset: 1314, length_words: 2, byte_order: BIG_ENDIAN, word_order: WORD_BIG_ENDIAN }  # 0x0522

          - point_id: reserved_0x0524
            name: "Reserved 0x0524"
            description: "Reserved by the vendor, no function assigned"
            access: READ_ONLY
            storage_type: U32
            value_type: { primitive: UINT32 }
            mapping: { space: HOLDING_REGISTER, offset: 1316, length_words: 2, byte_order: BIG_ENDIAN, word_order: WORD_BIG_ENDIAN }  # 0x0524

          - point_id: partial_meter_status
            name: "Partial Energy Meter Status"
            description: "Per-meter run state bitmap; 0 = inactive (stopped), 1 = active (started). Bits 13 ... 15 are reserved"
            access: READ_ONLY
            storage_type: U16
            value_type:
              flags:
                bits:
                  "0": active_energy_procurement
                  "1": active_energy_supply
                  "2": inductive_apparent_procurement
                  "3": inductive_apparent_supply
                  "4": capacitive_apparent_procurement
                  "5": capacitive_apparent_supply
                  "6": inductive_reactive_procurement
                  "7": inductive_reactive_supply
                  "8": capacitive_reactive_procurement
                  "9": capacitive_reactive_supply
                  "10": apparent_energy_system
                  "11": reactive_energy_supply
                  "12": reactive_energy_procurement
            mapping: { space: HOLDING_REGISTER, offset: 1318, length_words: 1, byte_order: BIG_ENDIAN }  # 0x0526
            measurand: { base_quantity: device_status }

          - point_id: reserved_0x0527
            name: "Reserved 0x0527"
            description: "Reserved by the vendor, 13 registers with no function assigned"
            access: READ_ONLY
            storage_type: BYTES_RAW
            value_type: { primitive: BYTES }
            mapping: { space: HOLDING_REGISTER, offset: 1319, length_words: 13, byte_order: BIG_ENDIAN, word_order: WORD_BIG_ENDIAN }  # 0x0527 ... 0x0533

      # --- A 16 / A 17: demand interval configuration (0x053C) --------------
      - block_id: demand_interval
        name: "Mean-Value Interval Configuration (0x053C)"
        space: HOLDING_REGISTER
        start_offset: 1340
        length_words: 2
        points:
          - point_id: demand_interval_config
            name: "Demand Interval Configuration"
            description: "Interval duration and synchronization source for the mean (DMD) values. The high byte selects the interval when the mean value is generated by broadcast command, the low byte when it is synchronized internally"
            access: READ_WRITE
            storage_type: U16
            value_type:
              flags:
                bits:
                  "0": internal_sync_10s
                  "1": internal_sync_30s
                  "2": internal_sync_1min
                  "3": internal_sync_5min
                  "4": internal_sync_10min
                  "5": internal_sync_15min
                  "6": internal_sync_30min
                  "7": internal_sync_60min
                  "8": broadcast_sync_10s
                  "9": broadcast_sync_30s
                  "10": broadcast_sync_1min
                  "11": broadcast_sync_5min
                  "12": broadcast_sync_10min
                  "13": broadcast_sync_15min
                  "14": broadcast_sync_30min
                  "15": broadcast_sync_60min
            mapping: { space: HOLDING_REGISTER, offset: 1340, length_words: 1, byte_order: BIG_ENDIAN }  # 0x053C
            write: { behavior: DIRECT }

          - point_id: demand_interval_sync
            name: "Demand Interval Synchronization Trigger"
            description: "Write 0x0001 to close and restart the mean-value interval; only used when 0x053C selects broadcast synchronization. If the broadcast command stops arriving the interval closes on its own after a device-defined delay"
            access: READ_WRITE
            storage_type: U16
            value_type: { primitive: UINT32 }
            mapping: { space: HOLDING_REGISTER, offset: 1341, length_words: 1, byte_order: BIG_ENDIAN }  # 0x053D
            write: { behavior: COMMAND_TRIGGER, constraints: { allowed_values: [1] } }

      # --- A 22: partial energy meter start / stop / reset (0x0526) ---------
      # Overlay of the status register above: reading 0x0526 returns the run
      # state bitmap, writing it performs one action on one meter. The write
      # word is (selector << 8) | action, e.g. 0x0D01 starts all partial
      # energy meters. Driven by the commands at the end of this profile.
      - block_id: partial_control
        name: "Partial Energy Meter Control (0x0526, write view)"
        space: HOLDING_REGISTER
        start_offset: 1318
        length_words: 1
        overlay: true
        points:
          - point_id: partial_meter_control
            name: "Partial Energy Meter Control"
