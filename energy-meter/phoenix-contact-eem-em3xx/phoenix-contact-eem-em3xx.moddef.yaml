# Source: Phoenix Contact "Energy meters with MID approval" user manual,
# UM EN EEM-EM/DM3xx, document 108591_en_02 (revision 02, 2024-01-08),
# appendix A "Modbus register" (tables A-2 ... A-23).
# Register map confirmed against the vendor document above; not yet hardware-verified.
# Part of the ModDef blessed device registry.
#
# https://www.phoenixcontact.com/  (order nos. 2908578, 2908588, 1252817,
# 1219095, 2908581, 2908590)
#
# Device family (manual table 2-1). All are three-phase / four-conductor MID
# energy meters (directive 2014/32/EU) with an S0 output:
#
#   EEM-EM355     2908578   CT measurement (1/5 A secondary)  Modbus/RTU
#   EEM-EM357     2908588   direct up to 80 A                 Modbus/RTU
#   EEM-DM357     1252817   direct up to 80 A                 Modbus/RTU
#   EEM-DM357-70  1219095   direct up to 63 A, MID to +70 C   Modbus/RTU
#   EEM-EM375     2908581   CT measurement (1/5 A secondary)  Modbus/TCP
#   EEM-EM377     2908590   direct up to 80 A                 Modbus/TCP
#
# The EEM-EM325 / EEM-EM327 of the same family speak M-Bus, not Modbus, and are
# out of scope for this profile. The Modbus/TCP models (EM375 / EM377) have no
# tariff input and no tariff registers; see the `eem-em37x-ethernet` variant.
#
# Encoding notes (from the manual, appendix A preamble and the per-table
# headers):
#   - Every register table declares "Functions 03", i.e. FC03 Read Holding
#     Registers, so the whole register map lives in the HOLDING_REGISTER space.
#     The write tables (A-18 ... A-22) declare 03/06/16; the alarm table (A-23)
#     declares function 01, so the alarm bits are COIL-space points. The device
#     only reads coils (FC01), so they carry allowed_function_codes: [1].
#   - "Interpret the bit sequence as AB. If there is more than one word, it is
#     interpreted as AB-CD" -> big-endian bytes within a word, big-endian word
#     order for multi-word values (BIG_ENDIAN + WORD_BIG_ENDIAN throughout).
#   - Addresses in the manual are given in both decimal and hex and are already
#     0-based protocol offsets, so ModDef offset = the manual's decimal address.
#     Each point carries the manual's hex address in a trailing comment.
#   - The "Divider" column is literal: value = raw / divider. Most dividers are
#     100 / 1000 / 10000. The A-2 display block uses divider 0.1 for the power
#     registers, i.e. value = raw * 10 (10 W / 10 var / 10 VA resolution) --
#     that matches the display resolution of 0.01 kW for P/Q/S in table 6-16.
#     These are modeled as scale {numerator: 10, denominator: 1}.
#   - Redundant views: the meter exposes the same physical quantities three
#     times over -- a scaled-integer "display" block mirroring the LCD pages
#     (0xC550 / 0xC650 / 0xC77E), a scaled-integer block at low addresses
#     (0x0000, 0x0100, ...), and an IEEE-754 float block (0x1000, 0x1100, ...).
#     All three are transcribed here and all three carry measurands, because
#     they genuinely measure the same thing; point ids disambiguate them.
#     Suffix `_f32` = the float view, `_disp` = the LCD/display view, no suffix
#     = the scaled-integer view. For polling, prefer the float blocks (no
#     divider bookkeeping) or the integer blocks at 0x0000/0x0100; the display
#     blocks are the coarsest.
#   - Tariff registers (A-8 ... A-11) are marked "Not available on energy
#     meters with Ethernet interface" in the manual.
#   - Manual defect, table A-13 (partial/balancing float block): the decimal
#     address column is wrong from 0x1406 onwards -- it prints 5128 for 0x1406
#     (= 5126) and every following row is shifted by +2, and the row for
#     0x1418 prints 5168 (= 5144). The hex column is contiguous and matches the
#     declared block size of 30 registers, so the hex addresses are taken as
#     authoritative here.
#   - Manual defect, table A-15 (DMD float block): the last two rows are
#     labelled "Mean value - inductive/capacitive power system"; per the
#     matching integer table A-14 these are the mean power *factor* of the
#     system. Transcribed as power factor.
#   - Table A-23 lists the undercurrent alarms out of order and against two
#     different thresholds: UI3/UIN sit at coils 16/17 against the secondary
#     current, while UIsys/UI1/UI2 sit at coils 29..31 against the starting
#     current. Transcribed exactly as documented.
#   - Register 0x0526 is dual-purpose: reading it returns the partial energy
#     meter status bitmap (A-17), writing it starts / stops / resets a partial
#     energy meter (A-22). The write side lives in an overlay block and is
#     driven by the start/stop/reset commands. Its two bytes are described by
#     typed sub-fields (spec 13.1) referencing the partial_meter_selector and
#     partial_meter_action enums. `moddef lint` reports MDW402 ("defined but
#     never used") for those two enums because it only credits enum references
#     reached through a point/param/result `value_type`, not through `fields`;
#     the references are real and the warnings are a linter blind spot.

doc_id: phoenixcontact.eem-em3xx
name: Phoenix Contact EEM-EM3xx / EEM-DM3xx MID Energy Meter
version: 1.0.0

imports:
  - uri: moddef:stdlib:measurands:1.0.0

enums:
  - type_id: phase_sequence
    name: Phase Sequence
    description: Phase rotation reported by register 0x0052
    values:
      - { value: 0, name: CCW_123, description: "123, counterclockwise" }
      - { value: 1, name: CW_132, description: "132, clockwise" }
      - { value: 2, name: NOT_AVAILABLE, description: Phase sequence not available }

  - type_id: active_tariff
    name: Active Tariff
    description: Tariff register currently accumulating (register 0x0510)
    values:
      - { value: 1, name: TARIFF_1, description: Tariff 1 active }
      - { value: 2, name: TARIFF_2, description: Tariff 2 active }

  - type_id: secondary_nominal_current
    name: Secondary Nominal Current
    description: Configured secondary nominal current (register 0x051A), encoded as the current in amperes
    values:
      - { value: 1, name: A_1, description: 1 A }
      - { value: 5, name: A_5, description: 5 A }
      - { value: 40, name: A_40, description: 40 A }
      - { value: 63, name: A_63, description: 63 A }
      - { value: 80, name: A_80, description: 80 A }

  - type_id: grid_type
    name: Grid Type
    description: Configured network topology (register 0x051C)
    values:
      - { value: 2, name: THREE_PHASE_3W_2I, description: "3 phases, 3 conductors, 2 currents" }
      - { value: 3, name: THREE_PHASE_3W_3I, description: "3 phases, 3 conductors, 3 currents" }
      - { value: 5, name: THREE_PHASE_4W_3I, description: "3 phases, 4 conductors, 3 currents" }

  - type_id: baud_rate
    name: Modbus/RTU Baud Rate
    description: Serial line speed code (registers 0x0522 and 0xE11F); 0xFFFFFFFF on devices with an Ethernet interface
    values:
      - { value: 0, name: BPS_2400, description: 2400 bps }
      - { value: 1, name: BPS_4800, description: 4800 bps }
      - { value: 2, name: BPS_9600, description: "9600 bps (default)" }
      - { value: 3, name: BPS_19200, description: 19200 bps }
      - { value: 4, name: BPS_38400, description: 38400 bps }
      - { value: 5, name: BPS_57600, description: 57600 bps }
      - { value: 6, name: RESERVED_6, description: Not available }
      - { value: 7, name: RESERVED_7, description: Not available }
      - { value: 8, name: BPS_300, description: 300 bps }
      - { value: 9, name: BPS_1200, description: 1200 bps }

  - type_id: parity
    name: Modbus/RTU Parity
    description: Serial line parity (register 0xE121)
    values:
      - { value: 0, name: NONE, description: "No parity (default)" }
      - { value: 1, name: EVEN, description: Even parity }
      - { value: 2, name: ODD, description: Odd parity }

  - type_id: stop_bits
    name: Modbus/RTU Stop Bits
    description: Serial line stop bits (register 0xE122)
    values:
      - { value: 0, name: ONE, description: "1 stop bit (default)" }
      - { value: 1, name: TWO, description: 2 stop bits }

  - type_id: dhcpv4_state
    name: DHCPv4 State
    description: DHCPv4 client state (register 0xE11C)
    values:
      - { value: 0, name: INACTIVE, description: "DHCPv4 disabled, static addressing" }
      - { value: 256, name: ACTIVE, description: "DHCPv4 enabled (0x0100)" }

  - type_id: config_action
    name: Configuration Action
    description: Action written to register 0xE200 to persist or reload the configuration
    values:
      - { value: 161, name: SAVE_TO_EEPROM, description: "0xA1 - buffer the configuration in EEPROM and restart" }
      - { value: 178, name: LOAD_FROM_EEPROM, description: "0xB2 - load the configuration from EEPROM" }

  - type_id: partial_meter_selector
    name: Partial Energy Meter Selector
    description: High byte of register 0x0526 on write - which partial energy meter the action applies to
    values:
      - { value: 0, name: ACTIVE_ENERGY_PROCUREMENT, description: Partial energy meter - active energy procurement system }
      - { value: 1, name: ACTIVE_ENERGY_SUPPLY, description: Partial energy meter - active energy supply system }
      - { value: 2, name: INDUCTIVE_APPARENT_PROCUREMENT, description: Partial energy meter - inductive apparent energy procurement system }
      - { value: 3, name: INDUCTIVE_APPARENT_SUPPLY, description: Partial energy meter - inductive apparent energy supply system }
      - { value: 4, name: CAPACITIVE_APPARENT_PROCUREMENT, description: Partial energy meter - capacitive apparent energy procurement system }
      - { value: 5, name: CAPACITIVE_APPARENT_SUPPLY, description: Partial energy meter - capacitive apparent energy supply system }
      - { value: 6, name: INDUCTIVE_REACTIVE_PROCUREMENT, description: Partial energy meter - inductive reactive energy procurement system }
      - { value: 7, name: INDUCTIVE_REACTIVE_SUPPLY, description: Partial energy meter - inductive reactive energy supply system }
      - { value: 8, name: CAPACITIVE_REACTIVE_PROCUREMENT, description: Partial energy meter - capacitive reactive energy procurement system }
      - { value: 9, name: CAPACITIVE_REACTIVE_SUPPLY, description: Partial energy meter - capacitive reactive energy supply system }
      - { value: 10, name: APPARENT_ENERGY_SYSTEM, description: Partial energy meter - apparent energy system }
      - { value: 11, name: REACTIVE_ENERGY_SUPPLY, description: Partial energy meter - reactive energy supply system }
      - { value: 12, name: REACTIVE_ENERGY_PROCUREMENT, description: Partial energy meter - reactive energy procurement system }
      - { value: 13, name: ALL, description: All partial energy meters }

  - type_id: partial_meter_action
    name: Partial Energy Meter Action
    description: Low byte of register 0x0526 on write - the action to perform
    values:
      - { value: 1, name: START, description: Start the selected partial energy meter }
      - { value: 2, name: STOP, description: Stop the selected partial energy meter }
      - { value: 3, name: RESET, description: Reset the selected partial energy meter }

devices:
  - device_id: phoenix-contact-eem-em3xx
    vendor: Phoenix Contact
    model: EEM-EM3xx / EEM-DM3xx
    family: EEM-EM3xx
    description: Three-phase MID energy meter (EEM-EM355/EM357/DM357/DM357-70 over Modbus/RTU, EEM-EM375/EM377 over Modbus/TCP)
    supported_transports:
      - MODBUS_RTU
      - MODBUS_TCP
    default_unit_id: 5
    blocks:
      # --- A 3: instantaneous values, scaled integer (0x0000) -------------
      - block_id: instantaneous
        name: "Instantaneous Values (integer, 0x0000)"
        space: HOLDING_REGISTER
        start_offset: 0
        length_words: 84
        points:
          - point_id: voltage_l1_n
            name: "Voltage L1-N"
            description: "Conductor voltage to N U1"
            access: READ_ONLY
            storage_type: U32
            value_type: { primitive: DECIMAL }
            mapping: { space: HOLDING_REGISTER, offset: 0, length_words: 2, byte_order: BIG_ENDIAN, word_order: WORD_BIG_ENDIAN }  # 0x0000
            transform: { scale: { numerator: 1, denominator: 1000 } }
            unit: V
            measurand: { base_quantity: voltage, phase_ref: L1_N }

          - point_id: voltage_l2_n
            name: "Voltage L2-N"
            description: "Conductor voltage to N U2"
            access: READ_ONLY
            storage_type: U32
            value_type: { primitive: DECIMAL }
            mapping: { space: HOLDING_REGISTER, offset: 2, length_words: 2, byte_order: BIG_ENDIAN, word_order: WORD_BIG_ENDIAN }  # 0x0002
            transform: { scale: { numerator: 1, denominator: 1000 } }
            unit: V
            measurand: { base_quantity: voltage, phase_ref: L2_N }

          - point_id: voltage_l3_n
            name: "Voltage L3-N"
            description: "Conductor voltage to N U3"
            access: READ_ONLY
            storage_type: U32
            value_type: { primitive: DECIMAL }
            mapping: { space: HOLDING_REGISTER, offset: 4, length_words: 2, byte_order: BIG_ENDIAN, word_order: WORD_BIG_ENDIAN }  # 0x0004
            transform: { scale: { numerator: 1, denominator: 1000 } }
            unit: V
            measurand: { base_quantity: voltage, phase_ref: L3_N }

          - point_id: voltage_l1_l2
            name: "Voltage L1-L2"
            description: "Conductor voltage to conductor U12"
            access: READ_ONLY
            storage_type: U32
            value_type: { primitive: DECIMAL }
            mapping: { space: HOLDING_REGISTER, offset: 6, length_words: 2, byte_order: BIG_ENDIAN, word_order: WORD_BIG_ENDIAN }  # 0x0006
            transform: { scale: { numerator: 1, denominator: 1000 } }
            unit: V
            measurand: { base_quantity: voltage, phase_ref: L1_L2 }

          - point_id: voltage_l2_l3
            name: "Voltage L2-L3"
            description: "Conductor voltage to conductor U23"
            access: READ_ONLY
            storage_type: U32
            value_type: { primitive: DECIMAL }
            mapping: { space: HOLDING_REGISTER, offset: 8, length_words: 2, byte_order: BIG_ENDIAN, word_order: WORD_BIG_ENDIAN }  # 0x0008
            transform: { scale: { numerator: 1, denominator: 1000 } }
            unit: V
            measurand: { base_quantity: voltage, phase_ref: L2_L3 }

          - point_id: voltage_l3_l1
            name: "Voltage L3-L1"
            description: "Conductor voltage to conductor U31"
            access: READ_ONLY
            storage_type: U32
            value_type: { primitive: DECIMAL }
            mapping: { space: HOLDING_REGISTER, offset: 10, length_words: 2, byte_order: BIG_ENDIAN, word_order: WORD_BIG_ENDIAN }  # 0x000A
            transform: { scale: { numerator: 1, denominator: 1000 } }
            unit: V
            measurand: { base_quantity: voltage, phase_ref: L3_L1 }

          - point_id: voltage_ll_sys
            name: "Voltage L-L System"
            description: "External conductor voltage system (mean of U12, U23, U31)"
            access: READ_ONLY
            storage_type: U32
            value_type: { primitive: DECIMAL }
            mapping: { space: HOLDING_REGISTER, offset: 12, length_words: 2, byte_order: BIG_ENDIAN, word_order: WORD_BIG_ENDIAN }  # 0x000C
            transform: { scale: { numerator: 1, denominator: 1000 } }
            unit: V
            measurand: { base_quantity: voltage, aggregation: AVERAGE }

          - point_id: current_l1
            name: "Current L1"
            description: "Current in conductor I1"
            access: READ_ONLY
            storage_type: U32
            value_type: { primitive: DECIMAL }
            mapping: { space: HOLDING_REGISTER, offset: 14, length_words: 2, byte_order: BIG_ENDIAN, word_order: WORD_BIG_ENDIAN }  # 0x000E
            transform: { scale: { numerator: 1, denominator: 1000 } }
            unit: A
            measurand: { base_quantity: current, phase_ref: L1 }

          - point_id: current_l2
            name: "Current L2"
            description: "Current in conductor I2"
            access: READ_ONLY
            storage_type: U32
            value_type: { primitive: DECIMAL }
            mapping: { space: HOLDING_REGISTER, offset: 16, length_words: 2, byte_order: BIG_ENDIAN, word_order: WORD_BIG_ENDIAN }  # 0x0010
            transform: { scale: { numerator: 1, denominator: 1000 } }
            unit: A
            measurand: { base_quantity: current, phase_ref: L2 }

          - point_id: current_l3
            name: "Current L3"
            description: "Current in conductor I3"
            access: READ_ONLY
            storage_type: U32
            value_type: { primitive: DECIMAL }
            mapping: { space: HOLDING_REGISTER, offset: 18, length_words: 2, byte_order: BIG_ENDIAN, word_order: WORD_BIG_ENDIAN }  # 0x0012
            transform: { scale: { numerator: 1, denominator: 1000 } }
            unit: A
            measurand: { base_quantity: current, phase_ref: L3 }

          - point_id: current_n
            name: "Current N"
            description: "Current in conductor In (neutral)"
            access: READ_ONLY
            storage_type: U32
            value_type: { primitive: DECIMAL }
            mapping: { space: HOLDING_REGISTER, offset: 20, length_words: 2, byte_order: BIG_ENDIAN, word_order: WORD_BIG_ENDIAN }  # 0x0014
            transform: { scale: { numerator: 1, denominator: 1000 } }
            unit: A
            measurand: { base_quantity: current, phase_ref: N }

          - point_id: current_sys
            name: "Current System"
            description: "System current (mean of I1, I2, I3)"
            access: READ_ONLY
            storage_type: U32
            value_type: { primitive: DECIMAL }
            mapping: { space: HOLDING_REGISTER, offset: 22, length_words: 2, byte_order: BIG_ENDIAN, word_order: WORD_BIG_ENDIAN }  # 0x0016
            transform: { scale: { numerator: 1, denominator: 1000 } }
            unit: A
            measurand: { base_quantity: current, aggregation: AVERAGE }

          - point_id: power_factor_l1
            name: "Power Factor L1"
            description: "Power factor phase 1; negative = capacitive, positive = inductive"
            access: READ_ONLY
            storage_type: S32
            value_type: { primitive: DECIMAL }
            mapping: { space: HOLDING_REGISTER, offset: 24, length_words: 2, byte_order: BIG_ENDIAN, word_order: WORD_BIG_ENDIAN }  # 0x0018
            transform: { scale: { numerator: 1, denominator: 1000 } }
            unit: "1"
            measurand: { base_quantity: power_factor, phase_ref: L1 }

          - point_id: power_factor_l2
            name: "Power Factor L2"
            description: "Power factor phase 2; negative = capacitive, positive = inductive"
            access: READ_ONLY
            storage_type: S32
            value_type: { primitive: DECIMAL }
            mapping: { space: HOLDING_REGISTER, offset: 26, length_words: 2, byte_order: BIG_ENDIAN, word_order: WORD_BIG_ENDIAN }  # 0x001A
            transform: { scale: { numerator: 1, denominator: 1000 } }
            unit: "1"
            measurand: { base_quantity: power_factor, phase_ref: L2 }

          - point_id: power_factor_l3
            name: "Power Factor L3"
            description: "Power factor phase 3; negative = capacitive, positive = inductive"
            access: READ_ONLY
            storage_type: S32
            value_type: { primitive: DECIMAL }
            mapping: { space: HOLDING_REGISTER, offset: 28, length_words: 2, byte_order: BIG_ENDIAN, word_order: WORD_BIG_ENDIAN }  # 0x001C
            transform: { scale: { numerator: 1, denominator: 1000 } }
            unit: "1"
            measurand: { base_quantity: power_factor, phase_ref: L3 }

          - point_id: power_factor_sys
            name: "Power Factor System"
            description: "System power factor; negative = capacitive, positive = inductive"
            access: READ_ONLY
            storage_type: S32
            value_type: { primitive: DECIMAL }
            mapping: { space: HOLDING_REGISTER, offset: 30, length_words: 2, byte_order: BIG_ENDIAN, word_order: WORD_BIG_ENDIAN }  # 0x001E
            transform: { scale: { numerator: 1, denominator: 1000 } }
            unit: "1"
            measurand: { base_quantity: power_factor, aggregation: TOTAL }

          - point_id: active_power_l1
            name: "Active Power L1"
            description: "Active power phase 1, signed"
            access: READ_ONLY
            storage_type: S64
            value_type: { primitive: DECIMAL }
            mapping: { space: HOLDING_REGISTER, offset: 32, length_words: 4, byte_order: BIG_ENDIAN, word_order: WORD_BIG_ENDIAN }  # 0x0020
            transform: { scale: { numerator: 1, denominator: 1000 } }
            unit: W
            measurand: { base_quantity: active_power, phase_ref: L1 }

          - point_id: active_power_l2
            name: "Active Power L2"
            description: "Active power phase 2, signed"
            access: READ_ONLY
            storage_type: S64
            value_type: { primitive: DECIMAL }
            mapping: { space: HOLDING_REGISTER, offset: 36, length_words: 4, byte_order: BIG_ENDIAN, word_order: WORD_BIG_ENDIAN }  # 0x0024
            transform: { scale: { numerator: 1, denominator: 1000 } }
            unit: W
            measurand: { base_quantity: active_power, phase_ref: L2 }

          - point_id: active_power_l3
            name: "Active Power L3"
            description: "Active power phase 3, signed"
            access: READ_ONLY
            storage_type: S64
            value_type: { primitive: DECIMAL }
            mapping: { space: HOLDING_REGISTER, offset: 40, length_words: 4, byte_order: BIG_ENDIAN, word_order: WORD_BIG_ENDIAN }  # 0x0028
            transform: { scale: { numerator: 1, denominator: 1000 } }
            unit: W
            measurand: { base_quantity: active_power, phase_ref: L3 }

          - point_id: active_power_total
            name: "Active Power Total"
            description: "Total active power, signed"
            access: READ_ONLY
            storage_type: S64
            value_type: { primitive: DECIMAL }
            mapping: { space: HOLDING_REGISTER, offset: 44, length_words: 4, byte_order: BIG_ENDIAN, word_order: WORD_BIG_ENDIAN }  # 0x002C
            transform: { scale: { numerator: 1, denominator: 1000 } }
            unit: W
            measurand: { base_quantity: active_power, aggregation: TOTAL }

          - point_id: apparent_power_l1
            name: "Apparent Power L1"
            description: "Apparent power phase 1"
            access: READ_ONLY
            storage_type: S64
            value_type: { primitive: DECIMAL }
            mapping: { space: HOLDING_REGISTER, offset: 48, length_words: 4, byte_order: BIG_ENDIAN, word_order: WORD_BIG_ENDIAN }  # 0x0030
            transform: { scale: { numerator: 1, denominator: 1000 } }
            unit: VA
            measurand: { base_quantity: apparent_power, phase_ref: L1 }

          - point_id: apparent_power_l2
            name: "Apparent Power L2"
            description: "Apparent power phase 2"
            access: READ_ONLY
            storage_type: S64
            value_type: { primitive: DECIMAL }
            mapping: { space: HOLDING_REGISTER, offset: 52, length_words: 4, byte_order: BIG_ENDIAN, word_order: WORD_BIG_ENDIAN }  # 0x0034
            transform: { scale: { numerator: 1, denominator: 1000 } }
            unit: VA
            measurand: { base_quantity: apparent_power, phase_ref: L2 }

          - point_id: apparent_power_l3
            name: "Apparent Power L3"
            description: "Apparent power phase 3"
            access: READ_ONLY
            storage_type: S64
            value_type: { primitive: DECIMAL }
            mapping: { space: HOLDING_REGISTER, offset: 56, length_words: 4, byte_order: BIG_ENDIAN, word_order: WORD_BIG_ENDIAN }  # 0x0038
            transform: { scale: { numerator: 1, denominator: 1000 } }
            unit: VA
            measurand: { base_quantity: apparent_power, phase_ref: L3 }

          - point_id: apparent_power_total
            name: "Apparent Power Total"
            description: "Total apparent power, signed"
            access: READ_ONLY
            storage_type: S64
            value_type: { primitive: DECIMAL }
            mapping: { space: HOLDING_REGISTER, offset: 60, length_words: 4, byte_order: BIG_ENDIAN, word_order: WORD_BIG_ENDIAN }  # 0x003C
            transform: { scale: { numerator: 1, denominator: 1000 } }
            unit: VA
            measurand: { base_quantity: apparent_power, aggregation: TOTAL }

          - point_id: reactive_power_l1
            name: "Reactive Power L1"
            description: "Reactive power phase 1, signed"
            access: READ_ONLY
            storage_type: S64
            value_type: { primitive: DECIMAL }
            mapping: { space: HOLDING_REGISTER, offset: 64, length_words: 4, byte_order: BIG_ENDIAN, word_order: WORD_BIG_ENDIAN }  # 0x0040
            transform: { scale: { numerator: 1, denominator: 1000 } }
            unit: var
            measurand: { base_quantity: reactive_power, phase_ref: L1 }

          - point_id: reactive_power_l2
            name: "Reactive Power L2"
            description: "Reactive power phase 2, signed"
            access: READ_ONLY
            storage_type: S64
            value_type: { primitive: DECIMAL }
            mapping: { space: HOLDING_REGISTER, offset: 68, length_words: 4, byte_order: BIG_ENDIAN, word_order: WORD_BIG_ENDIAN }  # 0x0044
            transform: { scale: { numerator: 1, denominator: 1000 } }
            unit: var
            measurand: { base_quantity: reactive_power, phase_ref: L2 }

          - point_id: reactive_power_l3
            name: "Reactive Power L3"
