      # Matrix rows 0x0300-0x036B: eight 24-byte time-interval definitions on a
      # 12-register stride, then the time-zone definition. All nine appear in
      # both the read table (03H) and the write table (10H), but the matrix
      # never says what the 24 bytes contain, so they stay raw byte strings.
      - block_id: tou_intervals
        name: "Time-of-Use Intervals"
        space: HOLDING_REGISTER
        start_offset: 768 # 0x0300
        length_words: 108
        points:
          - point_id: time_interval_1
            name: "Time Interval 1"
            description: "Time-of-use interval definition 1, 24 raw bytes across twelve registers. The matrix never describes what is inside them."
            access: READ_WRITE
            storage_type: BYTES_RAW
            value_type: { primitive: BYTES }
            mapping: { space: HOLDING_REGISTER, offset: 768, length_words: 12, byte_order: BIG_ENDIAN, word_order: WORD_BIG_ENDIAN, allowed_function_codes: [3, 16] } # 0x0300
            write: { behavior: DIRECT }

          - point_id: time_interval_2
            name: "Time Interval 2"
            description: "Time-of-use interval definition 2, 24 raw bytes across twelve registers. The matrix never describes what is inside them."
            access: READ_WRITE
