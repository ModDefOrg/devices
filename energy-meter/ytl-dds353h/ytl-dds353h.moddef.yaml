      # Spreadsheet sheet "Parameters setting part", third table. Three registers
      # holding two plain byte fields each: Year/Month, Day/Hour, Minute/Second.
      # No BCD. Only the first address made it into print; the other two rows
      # have a broken #N/A formula where the address should be.
      - block_id: clock
        name: "System Clock"
        space: HOLDING_REGISTER
        start_offset: 33056 # 0x8120
        length_words: 3
        points:
          - point_id: rtc_datetime
            name: "Real-Time Clock"
            description: "Meter clock, packed as six bytes across three registers: year (00-99), month (1-12), day (1-31), hour (0-23), minute (0-59), second (0-59), most significant byte first."
            access: READ_WRITE
            storage_type: BYTES_RAW
            value_type: { primitive: DATETIME }
            mapping: { space: HOLDING_REGISTER, offset: 33056, length_words: 3, byte_order: BIG_ENDIAN, word_order: WORD_BIG_ENDIAN } # 0x8120
            datetime: { encoding: SPLIT_FIELDS, width: U48 }
            write: { behavior: DIRECT }


      # Spreadsheet row "8140H | Holiday List*100 | MMDD": one register per
      # holiday date, 100 entries. The repeat count and the MMDD packing are
      # documented. The write function code is not, so this assumes the 10H that
      # the rest of the parameter area uses.
      - block_id: holiday_list
        name: "Holiday List"
        space: HOLDING_REGISTER
        start_offset: 33088 # 0x8140
        length_words: 100
        points:
          - point_id: holiday_dates
            name: "Holiday Dates"
            description: "100 holiday dates, one register each, packed as month in the high byte and day in the low byte (MMDD). An unused entry reads 0."
            access: READ_WRITE
            storage_type: U16
            value_type:
              array:
                element_type: { primitive: UINT32 }
                length: 100
            mapping: { space: HOLDING_REGISTER, offset: 33088, length_words: 100, byte_order: BIG_ENDIAN, word_order: WORD_BIG_ENDIAN, stride_words: 1 } # 0x8140
            write: { behavior: DIRECT }


      # Spreadsheet sheet "Multi tariff data area". 0xA00A-0xA01D are marked
      # "Keep" (reserved) and nothing documents 0xA028-0xA02F. Every energy
      # register runs 0 to 99999999, i.e. 0 to 999999.99 kWh or kvarh. What the
      # active registers actually count depends on the measurement mode in
      # register 0x0112.
      - block_id: energy
        name: "Multi-Tariff Energy Registers"
        space: HOLDING_REGISTER
        start_offset: 40960 # 0xA000
        length_words: 52
        points:
          - point_id: energy_active_total
            name: "Total Active Energy"
            description: "Present total active energy across all four tariffs. Put the meter in forward/reverse active energy mode (register 0x0112, low byte 0) and this register holds total FORWARD active energy instead."
            access: READ_ONLY
            storage_type: U32
            value_type: { primitive: DECIMAL }
            mapping: { space: HOLDING_REGISTER, offset: 40960, length_words: 2, byte_order: BIG_ENDIAN, word_order: WORD_BIG_ENDIAN } # 0xA000
            transform: { scale: { numerator: 1, denominator: 100 } }
            unit: kWh
            measurand: { base_quantity: energy_active, aggregation: TOTAL, accumulation: LIFETIME }

          - point_id: t1_energy_active
            name: "Tariff 1 Active Energy"
            description: "Present active energy accumulated in tariff register 1. In forward/reverse active energy mode it counts forward active energy instead."
            access: READ_ONLY
            storage_type: U32
            value_type: { primitive: DECIMAL }
            mapping: { space: HOLDING_REGISTER, offset: 40962, length_words: 2, byte_order: BIG_ENDIAN, word_order: WORD_BIG_ENDIAN } # 0xA002
            transform: { scale: { numerator: 1, denominator: 100 } }
            unit: kWh
            measurand: { base_quantity: energy_active, accumulation: LIFETIME }

          - point_id: t2_energy_active
            name: "Tariff 2 Active Energy"
            description: "Present active energy accumulated in tariff register 2. In forward/reverse active energy mode it counts forward active energy instead."
            access: READ_ONLY
            storage_type: U32
            value_type: { primitive: DECIMAL }
            mapping: { space: HOLDING_REGISTER, offset: 40964, length_words: 2, byte_order: BIG_ENDIAN, word_order: WORD_BIG_ENDIAN } # 0xA004
            transform: { scale: { numerator: 1, denominator: 100 } }
            unit: kWh
            measurand: { base_quantity: energy_active, accumulation: LIFETIME }

          - point_id: t3_energy_active
            name: "Tariff 3 Active Energy"
            description: "Present active energy accumulated in tariff register 3. In forward/reverse active energy mode it counts forward active energy instead."
            access: READ_ONLY
            storage_type: U32
            value_type: { primitive: DECIMAL }
            mapping: { space: HOLDING_REGISTER, offset: 40966, length_words: 2, byte_order: BIG_ENDIAN, word_order: WORD_BIG_ENDIAN } # 0xA006
            transform: { scale: { numerator: 1, denominator: 100 } }
            unit: kWh
            measurand: { base_quantity: energy_active, accumulation: LIFETIME }

          - point_id: t4_energy_active
            name: "Tariff 4 Active Energy"
            description: "Present active energy accumulated in tariff register 4. In forward/reverse active energy mode it counts forward active energy instead."
            access: READ_ONLY
            storage_type: U32
            value_type: { primitive: DECIMAL }
            mapping: { space: HOLDING_REGISTER, offset: 40968, length_words: 2, byte_order: BIG_ENDIAN, word_order: WORD_BIG_ENDIAN } # 0xA008
            transform: { scale: { numerator: 1, denominator: 100 } }
            unit: kWh
            measurand: { base_quantity: energy_active, accumulation: LIFETIME }

          - point_id: energy_reactive_total
            name: "Total Reactive Energy"
            description: "Present total reactive energy across all four tariffs. Put the meter in forward/reverse active energy mode (register 0x0112, low byte 0) and this register holds total REVERSE ACTIVE energy in kWh instead, at which point the unit given here no longer applies."
            access: READ_ONLY
            storage_type: U32
            value_type: { primitive: DECIMAL }
            mapping: { space: HOLDING_REGISTER, offset: 40990, length_words: 2, byte_order: BIG_ENDIAN, word_order: WORD_BIG_ENDIAN } # 0xA01E
            transform: { scale: { numerator: 1, denominator: 100 } }
            unit: kvarh
            measurand: { base_quantity: energy_reactive, aggregation: TOTAL, accumulation: LIFETIME }

          - point_id: t1_energy_reactive
            name: "Tariff 1 Reactive Energy"
            description: "Present reactive energy accumulated in tariff register 1. In forward/reverse active energy mode it holds reverse active energy in kWh instead, at which point the unit given here no longer applies."
            access: READ_ONLY
            storage_type: U32
            value_type: { primitive: DECIMAL }
            mapping: { space: HOLDING_REGISTER, offset: 40992, length_words: 2, byte_order: BIG_ENDIAN, word_order: WORD_BIG_ENDIAN } # 0xA020
            transform: { scale: { numerator: 1, denominator: 100 } }
            unit: kvarh
            measurand: { base_quantity: energy_reactive, accumulation: LIFETIME }

          - point_id: t2_energy_reactive
            name: "Tariff 2 Reactive Energy"
            description: "Present reactive energy accumulated in tariff register 2. In forward/reverse active energy mode it holds reverse active energy in kWh instead, at which point the unit given here no longer applies."
            access: READ_ONLY
            storage_type: U32
            value_type: { primitive: DECIMAL }
            mapping: { space: HOLDING_REGISTER, offset: 40994, length_words: 2, byte_order: BIG_ENDIAN, word_order: WORD_BIG_ENDIAN } # 0xA022
            transform: { scale: { numerator: 1, denominator: 100 } }
            unit: kvarh
            measurand: { base_quantity: energy_reactive, accumulation: LIFETIME }

          - point_id: t3_energy_reactive
            name: "Tariff 3 Reactive Energy"
            description: "Present reactive energy accumulated in tariff register 3. In forward/reverse active energy mode it holds reverse active energy in kWh instead, at which point the unit given here no longer applies."
            access: READ_ONLY
            storage_type: U32
            value_type: { primitive: DECIMAL }
            mapping: { space: HOLDING_REGISTER, offset: 40996, length_words: 2, byte_order: BIG_ENDIAN, word_order: WORD_BIG_ENDIAN } # 0xA024
            transform: { scale: { numerator: 1, denominator: 100 } }
            unit: kvarh
            measurand: { base_quantity: energy_reactive, accumulation: LIFETIME }

          - point_id: t4_energy_reactive
            name: "Tariff 4 Reactive Energy"
            description: "Present reactive energy accumulated in tariff register 4. In forward/reverse active energy mode it holds reverse active energy in kWh instead, at which point the unit given here no longer applies."
            access: READ_ONLY
            storage_type: U32
            value_type: { primitive: DECIMAL }
            mapping: { space: HOLDING_REGISTER, offset: 40998, length_words: 2, byte_order: BIG_ENDIAN, word_order: WORD_BIG_ENDIAN } # 0xA026
            transform: { scale: { numerator: 1, denominator: 100 } }
            unit: kvarh
            measurand: { base_quantity: energy_reactive, accumulation: LIFETIME }

          - point_id: demand_last_month_1
            name: "Demand, 1 Month Ago"
            description: "Recorded demand for the month before the current one. The spreadsheet gives an address and a label and nothing else: no data type, no range, no divider, no unit. Transcribed as an unscaled two-register unsigned value."
            access: READ_ONLY
            storage_type: U32
            value_type: { primitive: UINT32 }
            mapping: { space: HOLDING_REGISTER, offset: 41008, length_words: 2, byte_order: BIG_ENDIAN, word_order: WORD_BIG_ENDIAN } # 0xA030
            measurand: { base_quantity: active_power, aggregation: MAXIMUM, accumulation: MONTHLY }

          - point_id: demand_last_month_2
            name: "Demand, 2 Months Ago"
            description: "Recorded demand for two months before the current one. The spreadsheet gives an address and a label and nothing else: no data type, no range, no divider, no unit. Transcribed as an unscaled two-register unsigned value."
            access: READ_ONLY
            storage_type: U32
            value_type: { primitive: UINT32 }
            mapping: { space: HOLDING_REGISTER, offset: 41010, length_words: 2, byte_order: BIG_ENDIAN, word_order: WORD_BIG_ENDIAN } # 0xA032
            measurand: { base_quantity: active_power, aggregation: MAXIMUM, accumulation: MONTHLY }


      # Two rows at the end of the "Multi tariff data area" sheet. Both come with
      # a unit but no data type and no divider.
      - block_id: diagnostics
        name: "Temperature and Clock Correction"
        space: HOLDING_REGISTER
        start_offset: 65280 # 0xFF00
        length_words: 2
        points:
          - point_id: temperature
            name: "Internal Temperature"
            description: "Meter internal temperature. The spreadsheet gives the unit, degrees Celsius, but no data type and no divider. Transcribed as an unscaled signed register."
            access: READ_ONLY
            storage_type: S16
            value_type: { primitive: DECIMAL }
            mapping: { space: HOLDING_REGISTER, offset: 65280, byte_order: BIG_ENDIAN } # 0xFF00
            unit: degC
            measurand: { base_quantity: temperature }

          - point_id: clock_correction
            name: "Clock Correction"
            description: "Real-time-clock trim, documented with the unit \"S/D\", seconds per day. The spreadsheet gives no data type, no range and no divider. Transcribed as an unscaled signed register."
            access: READ_WRITE
            storage_type: S16
            value_type: { primitive: INT32 }
            mapping: { space: HOLDING_REGISTER, offset: 65281, byte_order: BIG_ENDIAN } # 0xFF01
            write: { behavior: DIRECT }


      # The final row of the "Multi tariff data area" sheet reads, in full,
      # "0xfff0 | Energy | W". A write-only register with no documented data
      # type, range or meaning. Kept as one write-only register so the address
      # is not lost. Do not write to it before confirming what it does.
      - block_id: energy_preset
        name: "Energy Preset"
        space: HOLDING_REGISTER
        start_offset: 65520 # 0xFFF0
        length_words: 1
        points:
          - point_id: energy_preset
            name: "Energy Preset"
            description: "Undocumented write-only energy register. The spreadsheet lists the address and write access and stops there. Most likely an energy preset or a clear. Not safe to use without confirming on hardware first."
            access: WRITE_ONLY
            storage_type: U16
            value_type: { primitive: UINT32 }
            mapping: { space: HOLDING_REGISTER, offset: 65520, byte_order: BIG_ENDIAN } # 0xFFF0
            write: { behavior: DIRECT, constraints: { safety_note: "Undocumented register on an MID-relevant energy counter; writing it may alter or clear billing registers" } }


    variants:
      # The "Single Phase" column of the "Real time data read" sheet marks seven
      # instantaneous registers as present on the single-phase models:
      # frequency, V1, I1, P1, Q1, S1 and PF1. Everything for phase 2, phase 3
      # and the system sums is unmarked, so this variant drops it. The
      # parameter, tariff-schedule, clock and energy blocks carry no per-phase
      # marking at all and stay as they are in the base profile.
      - variant_id: dds353h-single-phase
        name: DDS353H / YTL528x (single phase)
        base_device_id: ytl-dds353h
        removals:
          - voltage_l2_n
          - voltage_l3_n
          - current_l2
          - current_l3
          - active_power_l2
          - active_power_l3
          - active_power_total
          - reactive_power_l2
          - reactive_power_l3
          - reactive_power_total
          - apparent_power_l2
          - apparent_power_l3
          - apparent_power_total
          - power_factor_l2
          - power_factor_l3
          - power_factor_total
